<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f0e8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Signal not found — Vũ Đức Thuận</title>
  <style>
    :root { --paper:#f4f0e8; --ink:#11100f; --indigo:#234d7e; }
    * { box-sizing:border-box; }
    body {
      min-height:100svh; margin:0; display:grid; grid-template-rows:auto 1fr;
      background:var(--paper); color:var(--ink); font-family:"Segoe UI",sans-serif;
    }
    header { min-height:64px; display:flex; align-items:center; padding:0 clamp(20px,5vw,72px); border-bottom:1px solid var(--ink); font-weight:700; }
    main { display:grid; align-content:center; padding:clamp(48px,8vw,120px) clamp(20px,5vw,72px); }
    small { font:12px Consolas,monospace; letter-spacing:.1em; text-transform:uppercase; }
    h1 { max-width:9ch; margin:24px 0; font-size:clamp(64px,14vw,180px); line-height:.82; letter-spacing:-.07em; }
    h1 span { color:var(--indigo); }
    p { max-width:48ch; font-size:19px; line-height:1.6; }
    a { min-height:44px; display:inline-flex; align-items:center; margin-top:18px; color:inherit; font:600 13px Consolas,monospace; text-transform:uppercase; text-underline-offset:.3em; }
    a:focus-visible { outline:3px solid var(--indigo); outline-offset:5px; }
  </style>
</head>
<body>
  <header>Vũ Đức Thuận</header>
  <main>
    <small>Port 404 / no signal</small>
    <h1>Route <span>unresolved.</span></h1>
    <p>The requested page is not connected to this portfolio. Return to the repository index and choose a public signal.</p>
    <a href="/#repositories">Return to portfolio</a>
  </main>
</body>
</html>
